<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#711b23"><title>Red Booth</title><link rel="stylesheet" href="style.css"></head><body>
<button id="languageToggle" class="language-toggle" type="button" aria-label="Switch to English">EN</button>
<main>
<section id="welcome" class="screen welcome active" aria-label="照相馆入口" data-i18n-aria="welcomeArea"><span class="welcome-corner">RED BOOTH · 2026</span><div class="booth-wrap"><div class="booth-sign">RED BOOTH</div><div class="booth"><div class="booth-roof"></div><div class="booth-body"><div class="booth-curtain left"></div><div class="booth-curtain right"></div><div class="booth-door"><span data-i18n="doorLabel">PHOTO<br>BOOTH</span><button id="doorHandle" class="door-handle" aria-label="转动门把手" data-i18n-aria="doorHandle"><i></i></button></div></div><div class="booth-base"></div></div></div><button id="enterBtn" class="enter-btn" data-i18n="enter" hidden>进入 ↗</button></section>
<section id="studio" class="screen studio" aria-label="照片亭" data-i18n-aria="studioArea"><button id="homeBtn" class="corner-brand">✳ RED BOOTH</button>
<section id="formatStage" class="stage format-stage active"><div class="page-marker">01 / 04</div><h1 data-i18n="chooseFormat">选择照片格式</h1><div id="formatOptions" class="format-options"></div><button id="toFrames" class="next-btn" data-i18n="next">下一步 →</button></section>
<section id="selectStage" class="stage frame-stage"><div class="page-marker">02 / 04</div><h1 data-i18n="chooseFrame">选择相框</h1><div class="frame-center"><div id="framePreview" class="strip-preview"></div></div><div id="frameOptions" class="frame-options"></div><div class="stage-actions"><button id="backToFormats" class="plain-btn" data-i18n="back">← 返回</button><button id="toCapture" class="next-btn" data-i18n="next">下一步 →</button></div></section>
<section id="captureStage" class="stage capture-stage"><div class="page-marker">03 / 04</div><div class="capture-main"><div class="camera-shell"><div class="camera-top"><span data-i18n="live">● REC</span><span data-i18n="smile">SMILE, YOU'RE HERE! ✷</span></div><div class="camera-viewport"><video id="camera" autoplay playsinline muted></video><div id="cameraPlaceholder" class="camera-placeholder"><span>✦</span></div><div id="countOverlay" class="count-overlay" hidden></div></div><div class="camera-controls"><button id="openCamera" class="camera-open" aria-label="开启摄像头" data-i18n-aria="openCamera"><span class="camera-icon"><i></i></span><small data-i18n="openCamera">开启摄像头</small></button><button id="takePhoto" class="shutter" disabled aria-label="拍一张" data-i18n-aria="takePhoto"><i></i></button><button id="uploadBtn" class="upload-link" data-i18n="uploadPhotos">上传照片 ↗</button></div><p id="cameraMessage" class="camera-message">照片仅在本机处理</p></div><div class="shots-panel"><div class="shots-meta"><span id="shotCount">0 / 4</span><span data-i18n="shots">SHOTS</span></div><div id="shotGrid" class="shot-grid"></div><div class="capture-bottom"><button id="backToFrames" class="plain-btn" data-i18n="back">← 返回</button><button id="toPrint" class="next-btn" data-i18n="printNext" disabled>PRINT →</button></div></div></div></section>
<section id="uploadStage" class="stage upload-stage"><button id="backToCamera" class="upload-back" data-i18n="back">← BACK</button><div class="upload-center"><div id="uploadIntro"><div class="floating-photos" aria-hidden="true"><div></div><div></div><div></div></div><h1 data-i18n="uploadTitle">上传照片</h1></div><p id="uploadStatus">选择照片填满空位</p><div id="uploadPreview" class="upload-preview" hidden></div><button id="chooseFiles" class="upload-choose" data-i18n="chooseFiles">选择照片 ↗</button><button id="uploadPrint" class="next-btn" data-i18n="printNext" disabled>PRINT →</button></div></section>
<section id="printStage" class="stage print-stage"><div class="print-sign"><span>RED BOOTH</span><strong id="printTitle">PRINTING</strong><small id="printStatus" data-i18n="pleaseWait">请稍候</small></div><div class="printer"><div class="printer-slot"><div id="printingStrip" class="printing-strip"></div></div><div class="printer-inner"></div><div class="printer-foot" data-i18n="pickHere">PICK UP HERE ↓</div></div><div id="printTimer" class="print-timer"><strong id="printCountdown">5</strong><span data-i18n="seconds">SECONDS</span></div><button id="pickUpBtn" class="pick-up-btn" data-i18n="pickUp" hidden>PICK UP ↗</button></section>
<section id="resultStage" class="stage result-stage theme-white"><aside class="background-picker" aria-label="展示背景" data-i18n-aria="backgroundArea"><span data-i18n="background">BACKGROUND</span><div id="backgroundOptions"></div></aside><div class="result-center"><img id="resultImage" alt="照片预览" data-i18n-alt="photoPreview"><div class="result-actions"><button id="printBtn" data-i18n="print">PRINT</button><button id="downloadBtn" data-i18n="download">DOWNLOAD</button><button id="restartBtn" data-i18n="restart">RESTART</button></div></div></section>
<input id="fileInput" type="file" accept="image/*" multiple hidden></section></main><script src="i18n.js"></script><script src="script.js"></script></body></html>
