<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#b4d4e8">
  <meta name="description" content="从一百件人生小挑战中，抽取今天的勇气。">
  <title>人生的 100 个小挑战 · 雪日扭蛋机</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Long+Cang&family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;600;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="redesign.css">
  <link rel="stylesheet" href="minimal.css">
  <link rel="stylesheet" href="features.css">
</head>
<body>
  <div class="scene" id="scene">
    <div class="sky-glow"></div><div class="moon"></div><div class="snowfall" id="snowfall" aria-hidden="true"></div>
    <div class="mountains" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="town" aria-hidden="true"><div class="house h1"><b></b></div><div class="house h2"><b></b></div><div class="house h3"><b></b></div><div class="tree t1"></div><div class="tree t2"></div><div class="tree t3"></div></div>
    <div class="ground" aria-hidden="true"></div><div class="snow-decor" aria-hidden="true"><div class="snowman"><i></i><b></b></div><div class="fir fir-a"></div><div class="fir fir-b"></div><div class="fir fir-c"></div><div class="gift gift-a"></div><div class="gift gift-b"></div><div class="stars">✳ &nbsp; ✦ &nbsp; ✳</div></div>
    <header class="site-header"><span class="eyebrow">100 LITTLE ADVENTURES</span><div class="font-picker" aria-label="选择字体"><span>选字体</span><button type="button" data-font-choice="ink" aria-label="墨笔字体">墨笔</button><button type="button" data-font-choice="hand" aria-label="手写字体">手写</button><button type="button" data-font-choice="play" aria-label="俏皮字体">俏皮</button></div></header>
    <main class="main">
      <div class="intro"><div class="signpost"><div class="sign-rope rope-left"></div><div class="sign-rope rope-right"></div><div class="sign-arrow"><h1>人生的<span>100</span>个<br>小挑战</h1></div></div></div>
      <div class="machine-area">
        <div class="machine-shadow"></div>
        <div class="machine-tilt" id="machineTilt" aria-label="立体扭蛋机">
          <div class="machine-side"></div><div class="machine-top"></div>
          <div class="machine-face">
            <div class="machine-sign"><small>SNOW DAY GACHA</small><strong>小挑战扭蛋机</strong><span>✦ 100 LITTLE WISHES ✦</span></div>
            <div class="glass"><div class="glass-back"></div><div class="capsules" id="capsules" aria-hidden="true"></div><div class="glass-glare"></div><div class="dome-rim"></div></div>
            <div class="machine-body"><span class="metal-line"></span><div class="coin"><span>100</span><small>CHALLENGES</small></div><div class="lever" id="lever"><i></i></div><div class="chute"><div class="chute-inner"></div></div><div class="body-label">每一颗都藏着一个新故事 ✦</div></div>
            <div class="machine-foot"></div>
          </div>
        </div>
        <div class="tray"><span>✦</span><i></i></div>
        <div class="machine-hint">↔ 转动视角</div>
      </div>
      <div class="action-panel"><button id="drawBtn" class="draw-button" type="button"><span>抽一个挑战</span><b>↗</b></button><button id="openBookBtn" class="book-link" type="button">打开记录本 <span id="bookBadge" hidden></span> ↗</button></div>
    </main>
  </div>
  <div class="result-overlay" id="resultOverlay" hidden><div class="result-backdrop"></div><div class="result-stage" role="dialog" aria-modal="true" aria-labelledby="resultTitle"><button id="closeResult" class="close-button" type="button" aria-label="关闭">×</button><div class="result-heading" id="resultTitle">你的今日挑战来了 ✦</div><div class="result-capsule" id="resultCapsule"><div class="capsule-top"></div><div class="capsule-bottom"></div><div class="capsule-star">✦</div></div><div class="paper" id="paper"><div class="paper-top">A LITTLE ADVENTURE FOR YOU</div><div class="paper-number" id="paperNumber">NO. 001</div><div class="paper-text" id="paperText"></div><div class="paper-bottom">愿你在平凡的一天里，遇见一点惊喜。 ✳</div></div><div class="result-buttons"><button id="saveBtn" class="save-button" type="button">放进记录本 ✦</button><button id="againBtn" class="again-button" type="button">再抽一个 ↗</button></div></div></div>
  <div class="book-overlay" id="bookOverlay" hidden><div class="book-backdrop"></div><section class="notebook" role="dialog" aria-modal="true" aria-labelledby="bookTitle"><button id="closeBookBtn" class="book-close" type="button" aria-label="关闭记录本">×</button><div class="book-spine" aria-hidden="true"></div><div class="book-header"><small>MY LITTLE ADVENTURES</small><h2 id="bookTitle">小挑战记录本</h2><p id="bookSummary">把想做的小事，慢慢完成。</p></div><div id="bookList" class="book-list"></div><div class="book-footer">每打一个勾，都是人生里闪亮的一页 ✦</div></section></div>
  <script type="module" src="script.js?v=2"></script>
</body>
</html>
